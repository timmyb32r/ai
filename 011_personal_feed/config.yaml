    url_pattern: '^https://tapdata\.net/(blog/)?[^/?]+\.html$'
    max_pages: 1
  - id: taosdata
    name: TDengine 涛思数据博客
    url: https://www.taosdata.com/blog
    link_selector: 'main .gb-query-loop-item > a.gb-container-2d94c046'
    card_selector: '.gb-query-loop-item'
    title_selector: '.gb-headline-adfcb47c, main h1'
    url_pattern: '^https://www\.taosdata\.com/[^?#]+\.html$'
    next_selector: '.gb-query-loop-pagination a.gb-button-1e099794'
    max_pages: 2
  - id: timecho
    name: Timecho 技术解析
    url: https://www.timecho.com/tags/introduction
    link_selector: '.main-post-list-container a.post-container-wrapper'
    card_selector: '.post-container-wrapper'
