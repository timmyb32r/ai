    max_pages: 2
  - id: mirrorship
    name: Mirrorship
    url: https://www.mirrorship.cn/zh-CN/blog
    adapter: mirrorship
  - id: pingkai
    name: Pingkai / TiDB Community
    url: https://pingkai.cn/tidbcommunity/blog
    listing_url: https://pingkai.cn/tidbcommunity/blog?latest=true
    adapter: pingkai
    content_selector: article
  - id: aliyun-profile
    name: Aliyun — 灵杰开发者
