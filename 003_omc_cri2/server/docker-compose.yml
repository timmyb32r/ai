services:
  # ── HanLP Chinese NLP tokenizer ──────────────────────────────────────
  hanlp:
    build:
      context: .
      dockerfile: Dockerfile.hanlp
    image: criradio-hanlp:latest
    container_name: criradio-hanlp
    ports:
      - "8765:8765"
    volumes:
      - hanlp_models:/root/.hanlp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8765/parse', data=json.dumps({'text':'你好'}).encode(), headers={'Content-Type':'application/json'}))"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ── CRI Radio main server ────────────────────────────────────────────
  criradio:
    image: criradio-server:latest
    container_name: criradio
    ports:
      - "8080:8080"
      - "6060:6060"
    env_file:
      - .env
    environment:
      - ADDR=:8080
      - GSE_DICT_PATH=/opt/gse-dict
      - CEDICT_PATH=/opt/cedict_ts.u8
      - CHANNEL_URL=https://sk.cri.cn/905.m3u8
      - OUTPUT_DIR=/tmp/china_radio_international
      - DELAY=180s
      - LOG_LEVEL=info
      # When HANLP_URL is set, HanLP REST API is used instead of local GSE.
      - HANLP_URL=http://hanlp:8765
    volumes:
      - criradio_data:/tmp/china_radio_international
    restart: unless-stopped
    depends_on:
      hanlp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  criradio_data:
  hanlp_models:
